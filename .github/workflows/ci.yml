name: TradingView Indicator Checks

on:
  push:
  pull_request:

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bias math tests
        run: python tests/test_bias_logic.py
      - name: Indicator contracts
        run: python tests/test_indicator_contracts.py
      - name: Source sanity
        run: python tests/source_sanity.py
